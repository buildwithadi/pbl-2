<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job - Resume Scorer AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #34d399; /* emerald-500 */
            border-radius: 50%;
            width: 1.5rem;
            height: 1.5rem;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased flex flex-col min-h-screen">

    <header class="bg-gray-800 shadow-md border-b border-gray-700">
        <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">
                    AI Resume Scorer
                </a>
                <div class="flex items-center space-x-4">
                    <a href="/" class="bg-gray-700 text-white px-3 py-2 rounded-md text-sm font-medium">Student Portal</a>
                    <a href="/recruiter" class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Create Job</a>
                    <a href="/dashboard" class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
                </div>
            </div>
        </nav>
    </header>
    
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-gray-800 shadow-xl rounded-2xl p-8 md:p-12 w-full max-w-2xl">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500" id="main-header">
                    Apply for Job
                </h1>
                <p class="text-gray-400 mt-2" id="header-subtitle">
                    Upload your resume to score it against the job.
                </p>
            </div>

            <div id="student-view" class="space-y-6">
                
                <div id="job-info-display" class="p-4 bg-gray-700 border border-gray-600 rounded-lg">
                    <h2 class="text-lg font-semibold text-emerald-400 mb-2">Applying for Job:</h2>
                    <p id="job-info-text" class="text-gray-300 text-sm max-h-32 overflow-y-auto">
                        Loading job description...
                    </p>
                </div>

                <form id="scorer-form" class="space-y-6">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="full_name" class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
                            <input type="text" id="full_name" name="full_name" required class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                            <input type="email" id="email" name="email" required class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-emerald-500">
                        </div>
                    </div>
                    <div>
                        <label for="resume-file" class="block text-sm font-medium text-gray-300 mb-2">
                            Upload Your Resume (.pdf, .docx)
                        </label>
                        <input type="file" id="resume-file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="block w-full text-sm text-gray-400
                            file:mr-4 file:py-3 file:px-5 file:rounded-lg file:border-0 file:text-sm file:font-semibold
                            file:bg-emerald-500 file:text-emerald-950 hover:file:bg-emerald-400
                            file:transition-colors file:duration-200 file:cursor-pointer
                            bg-gray-700 rounded-lg cursor-pointer">
                    </div>

                    <div>
                        <button type="submit" id="submit-button" class="w-full flex items-center justify-center gap-3 py-3 px-5 text-lg font-semibold rounded-lg text-gray-900 bg-gradient-to-r from-emerald-400 to-cyan-500 hover:from-emerald-500 hover:to-cyan-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-gray-800 transition-all duration-200 transform hover:scale-105">
                            <span id="button-text">Calculate My Score</span>
                            <div id="loader" class="loader hidden"></div>
                        </button>
                    </div>
                </form>
            </div>

            <div id="result-container" class="mt-8 text-center hidden">
                <p class="text-gray-400 mb-2">Your match score is:</p>
                <div id="score-display" class="text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500"></div>
                <p id="score-feedback" class="text-lg text-gray-300 mt-4"></p>
            </div>

            <div id="error-container" class="mt-6 text-center text-red-400 hidden">
                <p id="error-message"></p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 shadow-inner mt-auto">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4 text-center text-gray-500">
            <p>&copy; 2025 AI Resume Scorer. All rights reserved.</p>
        </div>
    </footer>

    <script>
        let currentJobId = null;
        let jobInfoText, scorerForm, submitButton, buttonText, loader, resultContainer, scoreDisplay, scoreFeedback, errorContainer, errorMessage, resumeFileInput, mainHeader, headerSubtitle, fullNameInput, emailInput;

        window.addEventListener('load', () => {
            findElements();
            
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('job_id');

            if (jobId) {
                currentJobId = jobId;
                loadStudentView(jobId);
            } else {
                // No job_id found, show an error on the student page
                mainHeader.textContent = "Invalid Link";
                headerSubtitle.textContent = "This job application link is missing a job ID.";
                studentView.classList.add('hidden');
                showError("Please use the unique application link provided by the recruiter.");
            }
            scorerForm.addEventListener('submit', handleSubmitResume);
        });

        function findElements() {
            studentView = document.getElementById('student-view');
            headerSubtitle = document.getElementById('header-subtitle');
            mainHeader = document.getElementById('main-header');
            jobInfoText = document.getElementById('job-info-text');
            scorerForm = document.getElementById('scorer-form');
            submitButton = document.getElementById('submit-button');
            buttonText = document.getElementById('button-text');
            loader = document.getElementById('loader');
            resumeFileInput = document.getElementById('resume-file');
            resultContainer = document.getElementById('result-container');
            scoreDisplay = document.getElementById('score-display');
            scoreFeedback = document.getElementById('score-feedback');
            errorContainer = document.getElementById('error-container');
            errorMessage = document.getElementById('error-message');
            fullNameInput = document.getElementById('full_name');
            emailInput = document.getElementById('email');
        }

        async function loadStudentView(jobId) {
            try {
                const response = await fetch(`/job/${jobId}`);
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Job not found");
                }
                const data = await response.json();
                jobInfoText.textContent = data.text.substring(0, 300) + "...";
            } catch (error) {
                jobInfoText.textContent = "Error loading job description.";
                showError(error.message);
                submitButton.disabled = true;
            }
        }

        async function handleSubmitResume(e) {
            e.preventDefault();
            const resumeFile = resumeFileInput.files[0];
            const fullName = fullNameInput.value;
            const email = emailInput.value;

            hideError();
            hideResult();

            if (!resumeFile) {
                showError('Please upload your resume file.');
                return;
            }
            if (!fullName || !email) {
                showError('Please enter your name and email.');
                return;
            }
            if (!currentJobId) {
                showError('No job ID found. Please use the correct link.');
                return;
            }

            setLoading(true, buttonText, loader, submitButton);

            const formData = new FormData();
            formData.append('resume_file', resumeFile);
            formData.append('job_id', currentJobId);
            formData.append('full_name', fullName);
            formData.append('email', email);

            try {
                const response = await fetch('/score-resume/', {
                    method: 'POST',
                    body: formData,
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Server error: ${response.status}`);
                }
                const result = await response.json();
                showResult(result.match_percentage);
            } catch (error) {
                console.error('Error:', error);
                showError(error.message || 'An unexpected error occurred.');
            } finally {
                setLoading(false, buttonText, loader, submitButton);
            }
        }

        // --- UI Helper Functions (Unchanged) ---
        function setLoading(isLoading, textElem, loaderElem, buttonElem) {
            if (isLoading) {
                textElem.classList.add('hidden');
                loaderElem.classList.remove('hidden');
                buttonElem.disabled = true;
                buttonElem.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                textElem.classList.remove('hidden');
                loaderElem.classList.add('hidden');
                buttonElem.disabled = false;
                buttonElem.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
        function showResult(percentage) {
            const score = Math.round(percentage);
            scoreDisplay.textContent = `${score}%`;
            let feedback = '';
            if (score >= 85) {
                feedback = "Excellent match! You're a very strong candidate.";
            } else if (score >= 70) {
                feedback = "Great fit! Your resume aligns well with the role.";
            } else if (score >= 50) {
                feedback = "Good potential. Consider tailoring your resume to highlight key skills.";
            } else {
                feedback = "This might be a stretch. Review the JD and your resume for missing keywords.";
            }
            scoreFeedback.textContent = feedback;
            resultContainer.classList.remove('hidden');
        }
        function hideResult() {
            resultContainer.classList.add('hidden');
        }
        function showError(message) {
            errorMessage.textContent = message;
            errorContainer.classList.remove('hidden');
        }
        function hideError() {
            errorContainer.classList.add('hidden');
        }
    </script>
</body>
</html>
